"""
Everything the browser needs to open Razorpay Checkout. `keyId` is the public
Razorpay key; it is served from here rather than baked into the frontend build
so the client can never drift out of sync with the server's key pair.
"""
type PaymentOrder {
  orderId: String!
  amount: Int!
  currency: String!
  keyId: String!
  registrationId: ID!
  registrationType: RegistrationType!
  prefillName: String!
  prefillEmail: String!
  prefillContact: String!
}

type PaymentVerificationResult {
  verified: Boolean!
  registrationId: ID!
  paymentStatus: PaymentStatus!
  """Shown on the receipt so a support query can be traced without a hunt."""
  razorpayPaymentId: String
  razorpayOrderId: String
}

"""One payment Razorpay holds against an order. `captured` is the only status
where the money is actually ours; `authorized` is held but not taken."""
type GatewayPayment {
  paymentId: String!
  status: String!
  amount: Int!
  method: String
  email: String
  contact: String
}

"""
What Razorpay says actually happened, next to what we recorded. This is the
answer to "the customer says they paid": our own record only reflects what the
browser managed to report back.
"""
type PaymentReconciliation {
  registrationId: ID!
  ourPaymentStatus: PaymentStatus!
  ourAmount: Int!
  orderId: String!
  orderStatus: String!
  orderAmount: Int!
  amountPaid: Int!
  payments: [GatewayPayment!]!
  capturedPayment: GatewayPayment
  """True when the gateway captured money we never recorded - safe to settle."""
  settleable: Boolean!
}

input VerifyPaymentInput {
  registrationType: RegistrationType!
  registrationId: ID!
  razorpayOrderId: String!
  razorpayPaymentId: String!
  razorpaySignature: String!
}

extend type Mutation {
  """
  Opens a Razorpay order for an existing, unpaid registration. The amount comes
  from the stored registration, so the caller cannot choose what to pay.
  """
  createPaymentOrder(
    registrationType: RegistrationType!
    registrationId: ID!
  ): PaymentOrder!

  """
  Verifies the Checkout signature and marks the registration paid. Returns an
  error and leaves the registration untouched if the signature does not match.
  """
  verifyPayment(input: VerifyPaymentInput!): PaymentVerificationResult!

  """
  Asks Razorpay what happened to this registration's order. Read-only, so it is
  safe to run against any claim. A fabricated payment simply will not be there.
  """
  reconcilePayment(
    registrationType: RegistrationType!
    registrationId: ID!
  ): PaymentReconciliation!

  """
  Marks a registration paid using a payment Razorpay has captured but we never
  recorded. Re-checks the gateway itself, so it cannot be used to mark something
  paid on an admin's say-so.
  """
  settlePaymentFromGateway(
    registrationType: RegistrationType!
    registrationId: ID!
  ): PaymentReconciliation!
}
