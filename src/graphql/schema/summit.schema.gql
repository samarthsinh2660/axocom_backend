"""
Money state of a summit registration. Amounts are always stored and returned
in the smallest currency unit (paise for INR), matching Razorpay's convention.
"""
enum PaymentStatus {
  pending
  paid
  failed
  refunded
}

type DelegatePassRegistration {
  id: ID!
  fullName: String!
  designation: String!
  organisation: String!
  email: String!
  phone: String!
  passName: String!
  audience: String!
  quantity: Int!
  unitAmount: Int!
  totalAmount: Int!
  currency: String!
  gstNumber: String
  contactConsentAt: DateTime!
  paymentStatus: PaymentStatus!
  razorpayOrderId: String
  razorpayPaymentId: String
  paidAt: DateTime
  adminNote: String
  reviewedAt: DateTime
  reviewedByAdminId: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NominationRegistration {
  id: ID!
  nomineeName: String!
  organisation: String!
  designation: String!
  email: String!
  phone: String!
  website: String
  achievements: String!
  planName: String!
  totalAmount: Int!
  currency: String!
  contactConsentAt: DateTime!
  paymentStatus: PaymentStatus!
  razorpayOrderId: String
  razorpayPaymentId: String
  paidAt: DateTime
  adminNote: String
  reviewedAt: DateTime
  reviewedByAdminId: Int
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DelegatePassRegistrationConnection {
  data: [DelegatePassRegistration!]!
  pagination: Pagination!
}

type NominationRegistrationConnection {
  data: [NominationRegistration!]!
  pagination: Pagination!
}

type RegistrationResult {
  registrationId: ID!
  totalAmount: Int!
  paymentStatus: PaymentStatus!
}

type PaymentStatusTotals {
  count: Int!
  amount: Int!
}

type SummitRegistrationStats {
  delegatePaid: PaymentStatusTotals!
  delegatePending: PaymentStatusTotals!
  nominationPaid: PaymentStatusTotals!
  nominationPending: PaymentStatusTotals!
  openRefundRequests: Int!
}

input RegisterDelegatePassInput {
  fullName: String!
  designation: String!
  organisation: String!
  email: String!
  phone: String!
  passName: String!
  audience: String!
  quantity: Int!
  unitAmount: Int!
  gstNumber: String
  contactConsent: Boolean!
}

input RegisterNominationInput {
  nomineeName: String!
  organisation: String!
  designation: String!
  email: String!
  phone: String!
  website: String
  achievements: String!
  planName: String!
  totalAmount: Int!
  contactConsent: Boolean!
}

input UpdatePaymentStatusInput {
  paymentStatus: PaymentStatus!
  adminNote: String
}

extend type Query {
  adminDelegatePassRegistrations(
    paymentStatus: PaymentStatus
    search: String
    page: Int = 1
    limit: Int = 20
  ): DelegatePassRegistrationConnection!
  adminDelegatePassRegistration(id: ID!): DelegatePassRegistration
  adminNominationRegistrations(
    paymentStatus: PaymentStatus
    search: String
    page: Int = 1
    limit: Int = 20
  ): NominationRegistrationConnection!
  adminNominationRegistration(id: ID!): NominationRegistration
  adminSummitStats: SummitRegistrationStats!
}

extend type Mutation {
  registerDelegatePass(input: RegisterDelegatePassInput!): RegistrationResult!
  registerNomination(input: RegisterNominationInput!): RegistrationResult!
  updateDelegatePassPaymentStatus(id: ID!, input: UpdatePaymentStatusInput!): Boolean!
  updateNominationPaymentStatus(id: ID!, input: UpdatePaymentStatusInput!): Boolean!
}
